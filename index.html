<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRCS QBank</title>
<meta name="theme-color" content="#4a5a72"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MRCS QBank"><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1f2733;--mute:#6b7280;--line:#e5e1da;--navy:#4a5a72;--navy2:#3b485c;
--red:#e0675f;--acc:#3f6aa8;--accs:#e7eef8;--opt:#efe9e5;--sel:#dde2ec;--ok:#6fbf73;--okd:#2f8a4c;--oks:#e8f5ea;
--bad:#c0392b;--bads:#fbeaea;--flag:#e08a1e;--hl:#fff176}
@media (prefers-color-scheme:dark){:root{--bg:#15181d;--card:#1e2229;--ink:#e6e8eb;--mute:#9aa1ab;--line:#2d323b;
--opt:#262b33;--sel:#2e3a50;--accs:#24324a;--acc:#8fb0e3;--oks:#1c3424;--bads:#3a2221;--okd:#6fd08f;--hl:#8a7a12}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:0 18px;height:54px}
.top .brand{font-weight:700;font-size:18px;letter-spacing:.2px;margin-right:14px;cursor:pointer;white-space:nowrap}
.top .brand b{font-weight:800}
.top nav{display:flex;gap:2px;overflow-x:auto}
.top nav button{background:none;border:0;color:#dfe5ee;padding:8px 12px;border-radius:6px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.top nav button.on,.top nav button:hover{background:rgba(255,255,255,.12);color:#fff}
main{max-width:980px;margin:0 auto;padding:22px 16px 90px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 15px}
.btn:hover{border-color:var(--acc)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.go{background:#2bc48a;border-color:#2bc48a;color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}.btn.ghost{border-color:transparent;background:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 12px;font-weight:650}
h1{font-size:24px;margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:13px}.b{font-weight:650}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:750;line-height:1.2}.kpi .l{font-size:13px;color:var(--mute)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;color:var(--ink)}
.quick button:hover{border-color:var(--acc)}.quick button b{display:block;font-size:15px}.quick button span{font-size:13px;color:var(--mute)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pl{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.pl:first-child{border-top:0}
.pl .n{flex:1;min-width:0}.pl .bar{width:150px}.pl .c{width:96px;text-align:right;font-size:13px;color:var(--mute);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accs);color:var(--acc);font-weight:650}
.field{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}.field>label{width:110px;flex:none;color:var(--mute);font-size:14px;padding-top:7px}
@media (max-width:620px){.field{flex-direction:column;gap:6px}.field>label{padding:0}}
input[type=number],input[type=search],textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=number]{width:90px}textarea{width:100%;min-height:70px;resize:vertical}
.ch{border-top:1px solid var(--line)}.ch:first-child{border-top:0}
.chh{display:flex;align-items:center;gap:8px;padding:7px 0}.chh .tw{width:18px;color:var(--mute);cursor:pointer;font-size:12px;text-align:center}
.chh .nm{flex:1;cursor:pointer}.chh .c{font-size:13px;color:var(--mute);white-space:nowrap}
.secs{display:none;padding:0 0 6px 52px}.ch.open .secs{display:block}
.secs label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;font-size:15px}.secs label .c{margin-left:auto;font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:5px;background:var(--accs);color:var(--acc);margin-left:6px;vertical-align:middle}
/* ---------- question screen (Pastest look) ---------- */
.qwrap{display:flex;gap:16px;align-items:flex-start}.qmain{flex:1;min-width:0}
.qhead{background:var(--navy);color:#fff;border-radius:10px 10px 0 0;padding:16px 22px;display:flex;align-items:center;gap:14px}
.qhead .logo{font-size:24px;font-weight:300;letter-spacing:-.3px}.qhead .logo b{font-weight:700}
.qhead .qn{margin-left:auto;font-size:22px;font-weight:500}
.qprog{height:8px;background:#7a8597;display:flex}.qprog i{background:var(--red);display:block}
.qbody{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:22px 24px}
.qmeta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);font-size:15px}.timer.low{color:var(--bad)}
.stem{white-space:pre-wrap;margin:0 0 10px;color:#4b5563}@media (prefers-color-scheme:dark){.stem{color:#c7ccd3}}
.lead{font-weight:700;margin:12px 0 16px;color:var(--ink)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.opt{display:flex;align-items:stretch;gap:4px;margin:0 0 6px;cursor:pointer;user-select:none}
.opt .l{width:44px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--opt);color:var(--mute);border-radius:4px 0 0 4px}
.opt .t{flex:1;background:var(--opt);padding:11px 14px;border-radius:0 4px 4px 0;display:flex;align-items:center;gap:8px}
.opt .t span{flex:1}.opt .x{opacity:0;border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px}
.opt:hover .x{opacity:.8}.opt.sel .l,.opt.sel .t{background:var(--sel)}
.opt.ok .l,.opt.ok .t{background:var(--ok);color:#fff}.opt.bad .l,.opt.bad .t{background:var(--bads);color:var(--bad)}
.opt.struck .t span{text-decoration:line-through;opacity:.45}
.opt.ro{cursor:default}
.qnav{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.flagbtn.on{color:var(--flag);border-color:var(--flag)}
.exp{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.exp h3{font-size:20px;font-weight:500;margin:0 0 12px}
.exp .eo{margin-bottom:14px}.exp .eo p{margin:8px 0 0;white-space:pre-wrap;font-size:15px;color:#4b5563}
@media (prefers-color-scheme:dark){.exp .eo p{color:#c7ccd3}}
.yours{font-size:12px;font-weight:700;margin-left:8px;opacity:.85}
.verdict{font-weight:700;margin:0 0 14px;font-size:17px}.verdict.ok{color:var(--okd)}.verdict.bad{color:var(--bad)}
img.orig{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;display:block}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
.side{width:236px;flex:none;position:sticky;top:70px}
@media (max-width:860px){.qwrap{flex-direction:column}.side{width:100%;position:static}}
@media (max-width:620px){main{padding:14px 10px 80px}.qhead{padding:12px 14px}.qhead .logo{font-size:19px}.qhead .qn{font-size:17px}
 .qbody{padding:16px 14px}.opt .l{width:36px}.opt .t{padding:10px 10px}.card{padding:14px}.top{padding:0 8px}.top .brand{font-size:16px;margin-right:4px}
 .top nav button{padding:8px 8px;font-size:14px}.pl .bar{width:80px}.kbd{display:none}table{font-size:13px}}
.mrow{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:flex-start}.mrow:first-child{border-top:0}
.mrow .q{flex:1;min-width:0}.mrow .ab{font-size:13px;margin-top:4px}.mrow .ab b.r{color:var(--bad)}.mrow .ab b.g{color:var(--okd)}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:52vh;overflow:auto;padding:2px}
.navgrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 0;font-size:13px;position:relative}
.navgrid .ans{background:var(--sel)}.navgrid .ok{background:var(--oks);border-color:var(--ok)}.navgrid .bad{background:var(--bads);border-color:var(--bad)}
.navgrid .cur{outline:2px solid var(--acc);outline-offset:1px}.navgrid .fl::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:3px;background:var(--flag)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.paused .qbody>*:not(.pausecover){filter:blur(7px);pointer-events:none}
.pausecover{display:none}.paused .pausecover{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;z-index:5}
.qbody{position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:650;cursor:pointer}
td.n,th.n{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:650}
.pill.g{background:var(--oks);color:var(--okd)}.pill.a{background:#fdf1dc;color:#9a5b00}.pill.r{background:var(--bads);color:var(--bad)}
.big{font-size:44px;font-weight:800;line-height:1}
.kbd{font-size:12px;color:var(--mute);margin-top:12px}
.empty{color:var(--mute);padding:10px 0}
svg text{fill:var(--mute);font-size:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:50}
</style></head><body>
<div class="top"><div class="brand" data-act="go" data-v="dash">MRCS <b>QBank</b></div>
<nav id="nav"></nav></div>
<main id="app"></main>
<script src="data-1.js"></script><script src="data-2.js"></script><script src="data-3.js"></script><script>
"use strict";
const DB=JSON.parse(window.__QB.join(''));
// ---------------------------------------------------------------- data
const T={};DB.topics.forEach(t=>T[t.id]=t);
const PAPER={1:1,4:1,5:1,8:1,9:1,11:1,12:1,2:2,3:2,6:2,7:2,10:2};   // chapter -> MRCS Part A paper
const PAPERS={1:'Paper 1 · Applied Basic Sciences',2:'Paper 2 · Principles of Surgery in General'};
DB.questions.forEach(q=>{q.key=T[q.t].section_no+':'+q.p;q.ch=T[q.t].chapter_no;q.paper=PAPER[q.ch]||1});
const QK={};DB.questions.forEach(q=>QK[q.key]=q);
const CH={};DB.topics.forEach(t=>{(CH[t.chapter_no]=CH[t.chapter_no]||{no:t.chapter_no,name:t.chapter,secs:[]}).secs.push(t)});
// ---------------------------------------------------------------- storage
const LS='mrcsqbank.v1';
let P={h:{},f:{},notes:{},sessions:[],cur:null,cfg:null,m:{},exp:0};
try{Object.assign(P,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
P.h=P.h||{};P.f=P.f||{};P.notes=P.notes||{};P.sessions=P.sessions||[];P.m=P.m||{};P.exp=P.exp||0;
let saveT=null;
function save(now){clearTimeout(saveT);const f=()=>{try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){toast('Could not save progress in this browser')}};now?f():saveT=setTimeout(f,400)}
const cfg=Object.assign({sel:DB.topics.map(t=>t.id),pool:'new',n:20,mode:'practice',order:'random',timer:'up'},P.cfg||{});
function saveCfg(){P.cfg=cfg;save()}
// ---------------------------------------------------------------- helpers
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const last=k=>{const h=P.h[k];return h&&h.length?h[h.length-1]:null};      // [time, chosen, correct?, secs]
const day=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function summary(qs){let a=0,c=0;for(const q of qs){const l=last(q.key);if(l){a++;if(l[2])c++}}return{a,c,t:qs.length}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function accColor(p){return p>=75?'var(--ok)':p>=55?'#e9a23b':'var(--bad)'}
function bar(a,c,t){return `<div class="bar" title="${a}/${t} answered, ${pct(c,a)}% correct"><i style="width:${t?100*c/t:0}%;background:var(--ok)"></i><i style="width:${t?100*(a-c)/t:0}%;background:#e8a29c"></i></div>`}
// ---------------------------------------------------------------- routing
let view='dash',S=null,tick=null;
const NAV=[['dash','Dashboard'],['build','New session'],['mistakes','Wrong questions'],['history','History'],['perf','Performance'],['flagged','Flagged & notes']];
function go(v,arg){if(S&&v!=='quiz'){pauseClock()}view=v;stopTick();
  $('nav').innerHTML=NAV.map(([k,l])=>`<button class="${k===v?'on':''}" data-act="go" data-v="${k}">${l}</button>`).join('');
  ({dash,build,mistakes,history,perf,flagged,quiz,results})[v](arg);scrollTo(0,0)}
// ---------------------------------------------------------------- dashboard
function streak(){const ds=new Set(Object.values(P.h).flat().map(x=>day(x[0])));let n=0,d=new Date();
  if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function dash(){
  const all=summary(DB.questions),today=day(Date.now());
  let tdN=0,tdC=0,tsec=0,tn=0;Object.values(P.h).forEach(h=>h.forEach(x=>{if(day(x[0])===today){tdN++;tdC+=x[2]}if(x[3]){tsec+=x[3];tn++}}));
  const wrong=DB.questions.filter(q=>{const l=last(q.key);return l&&!l[2]}).length,flagged=Object.keys(P.f).length;
  const cur=P.sessions.find(s=>s.id===P.cur&&!s.done);
  let h=`<h1>Dashboard</h1><div class="grid4" style="margin-bottom:16px">
   <div class="kpi"><div class="v">${all.a}<span class="mute" style="font-size:15px;font-weight:500"> / ${all.t}</span></div><div class="l">questions answered</div><div class="bar" style="margin-top:8px"><i style="width:${pct(all.a,all.t)}%;background:var(--acc)"></i></div></div>
   <div class="kpi"><div class="v" style="color:${all.a?accColor(pct(all.c,all.a)):'inherit'}">${all.a?pct(all.c,all.a)+'%':'–'}</div><div class="l">correct (latest attempt)</div></div>
   <div class="kpi"><div class="v">${tdN}</div><div class="l">today${tdN?' · '+pct(tdC,tdN)+'% correct':''}</div></div>
   <div class="kpi"><div class="v">${streak()}</div><div class="l">day streak${tn?' · '+Math.round(tsec/tn)+' s / question':''}</div></div></div>`;
  if(cur){const n=cur.qs.length,a=Object.keys(cur.ans).length;
    h+=`<div class="card row"><div><div class="b">Unfinished ${cur.mode==='exam'?'exam':'session'}: ${esc(cur.name)}</div><div class="mute small">${a}/${n} answered · started ${new Date(cur.start).toLocaleString()}</div></div><span class="sp"></span>
    <button class="btn" data-act="discard">Discard</button><button class="btn go" data-act="resume">Resume</button></div>`}
  h+=`<div class="card"><h2>Quick start</h2><div class="quick">
   <button data-act="quick" data-k="new10"><b>10 new questions</b><span>Random unanswered, practice mode</span></button>
   <button data-act="quick" data-k="wrong" ${wrong?'':'disabled'}><b>Revise my mistakes</b><span>${wrong} answered wrong last time</span></button>
   <button data-act="quick" data-k="flag" ${flagged?'':'disabled'}><b>Flagged questions</b><span>${flagged} flagged</span></button>
   <button data-act="quick" data-k="mini"><b>Mini mock · 60 Q</b><span>Mixed papers, 60 min, exam mode</span></button>
   <button data-act="quick" data-k="p1"><b>Mock Paper 1 · 180 Q</b><span>Applied Basic Sciences, 3 h</span></button>
   <button data-act="quick" data-k="p2"><b>Mock Paper 2 · 120 Q</b><span>Principles of Surgery in General, 2 h</span></button>
  </div></div><div class="grid2">`;
  for(const pp of [1,2]){h+=`<div class="card"><h2>${PAPERS[pp]}</h2>`;
    Object.values(CH).filter(c=>(PAPER[c.no]||1)===pp).forEach(c=>{const s=summary(DB.questions.filter(q=>q.ch===c.no));
      h+=`<div class="pl"><div class="n"><div class="small b">${c.no}. ${esc(c.name)}</div></div>${bar(s.a,s.c,s.t)}<div class="c">${s.a}/${s.t}${s.a?' · '+pct(s.c,s.a)+'%':''}</div></div>`});
    h+='</div>'}
  app.innerHTML=h+'</div><p class="mute small">Bars: green = correct, pink = wrong, grey = not yet answered.</p>';
}
// ---------------------------------------------------------------- session builder
function poolOf(c){const sel=new Set(c.sel);return DB.questions.filter(q=>sel.has(q.t)).filter(q=>{const l=last(q.key);
  return c.pool==='all'||(c.pool==='new'&&!l)||(c.pool==='wrong'&&l&&!l[2])||(c.pool==='flag'&&P.f[q.key])})}
function seg(k,opts){return `<span class="seg">`+opts.map(([v,l])=>`<button class="${String(cfg[k])===String(v)?'on':''}" data-act="cfg" data-k="${k}" data-val="${v}">${l}</button>`).join('')+`</span>`}
const openCh=new Set();
function build(){
  const sel=new Set(cfg.sel);
  let h=`<h1>New session</h1><div class="card"><h2>Topics</h2><div class="row small" style="margin-bottom:10px">
    <button class="btn sm" data-act="selp" data-p="0">All</button><button class="btn sm" data-act="selp" data-p="1">Paper 1 only</button>
    <button class="btn sm" data-act="selp" data-p="2">Paper 2 only</button><button class="btn sm" data-act="selp" data-p="-1">Clear</button></div>`;
  Object.values(CH).forEach(c=>{const on=c.secs.filter(t=>sel.has(t.id)).length,qs=DB.questions.filter(q=>q.ch===c.no),s=summary(qs);
    h+=`<div class="ch ${openCh.has(c.no)?'open':''}" id="ch${c.no}"><div class="chh"><span class="tw" data-act="tog" data-c="${c.no}">${openCh.has(c.no)?'▼':'▶'}</span>
    <input type="checkbox" data-act="selch" data-c="${c.no}" ${on===c.secs.length?'checked':''} ${on&&on<c.secs.length?'data-ind="1"':''}>
    <span class="nm" data-act="tog" data-c="${c.no}">${c.no}. ${esc(c.name)}<span class="tag">P${PAPER[c.no]||1}</span></span><span class="c">${s.a}/${s.t}</span></div><div class="secs">`+
    c.secs.map(t=>{const m=summary(qs.filter(q=>q.t===t.id));return `<label><input type="checkbox" data-act="selsec" data-t="${t.id}" ${sel.has(t.id)?'checked':''}> ${t.section_no} ${esc(t.section)}<span class="c">${m.a}/${m.t}${m.a?' · '+pct(m.c,m.a)+'%':''}</span></label>`}).join('')+`</div></div>`});
  h+=`</div><div class="card"><h2>Settings</h2>
   <div class="field"><label>Questions</label>${seg('pool',[['new','Unanswered'],['wrong','Answered wrong'],['flag','Flagged'],['all','All']])}</div>

  <table><tr><th data-act="psort" data-s="sec">Section</th><th class="n" data-act="psort" data-s="done">Done</th><th class="n" data-act="psort" data-s="acc">Correct</th><th class="n" data-act="psort" data-s="time">Time / Q</th><th></th></tr>
  ${rows.sort(srt).map(r=>`<tr><td>${r.t.section_no} ${esc(r.t.section)}</td><td class="n">${r.m.a}/${r.m.t}</td><td class="n">${r.m.a?`<span class="pill ${r.p>=.75?'g':r.p>=.55?'a':'r'}">${pct(r.m.c,r.m.a)}%</span>`:'–'}</td><td class="n">${r.tq?Math.round(r.tq)+' s':'–'}</td><td class="n"><button class="btn sm" data-act="drill" data-t="${r.t.id}">Practise</button></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Your data</h2><p class="mute small" style="margin-top:0">Progress is saved in this browser only. Export it to back it up or to move it to another browser or computer.</p>
  <div class="row"><button class="btn" data-act="export">Export progress</button><button class="btn" data-act="import">Import progress</button><input type="file" id="impf" accept=".json" style="display:none">
  <span class="sp"></span><button class="btn" data-act="reset" style="color:var(--bad)">Reset everything</button></div></div>`;
  app.innerHTML=h;
  $('impf').addEventListener('change',e=>importP(e.target.files[0]))}
function exportP(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));
  a.download='mrcs-qbank-progress-'+day(Date.now())+'.json';a.click()}
function importP(f){if(!f)return;f.text().then(t=>{const x=JSON.parse(t);for(const k in (x.h||{})){const seen=new Set((P.h[k]||[]).map(a=>a[0]));P.h[k]=(P.h[k]||[]).concat(x.h[k].filter(a=>!seen.has(a[0]))).sort((a,b)=>a[0]-b[0])}
  Object.assign(P.f,x.f||{});Object.assign(P.notes,x.notes||{});const ids=new Set(P.sessions.map(s=>s.id));(x.sessions||[]).forEach(s=>{if(!ids.has(s.id))P.sessions.push(s)});
  P.sessions.sort((a,b)=>a.start-b.start);save(true);toast('Progress imported');perf()}).catch(()=>toast('That file could not be read'))}
// ---------------------------------------------------------------- mistakes tracker
let mf={scope:'now',since:'all'};
function mistakeList(){
  // scope "now": latest attempt wrong; "ever": wrong at least once. P.m[key] = time you marked it mastered.
  const out=[];for(const k in P.h){const q=QK[k];if(!q)continue;const h=P.h[k],wrongs=h.filter(x=>!x[2]);if(!wrongs.length)continue;
    const l=h[h.length-1];if(mf.scope==='now'&&l[2])continue;const lw=wrongs[wrongs.length-1];
    if(P.m[k]&&P.m[k]>lw[0])continue;                                   // mastered after the last mistake
    if(mf.since==='7'&&lw[0]<Date.now()-7*864e5)continue;if(mf.since==='exp'&&lw[0]<=P.exp)continue;
    out.push({q,k,n:wrongs.length,tries:h.length,lw,last:l})}
  return out.sort((a,b)=>b.lw[0]-a.lw[0])}
function mseg(k,opts){return `<span class="seg">`+opts.map(([v,l])=>`<button class="${mf[k]===v?'on':''}" data-act="mf" data-k="${k}" data-val="${v}">${l}</button>`).join('')+`</span>`}
function mistakes(){
  const L=mistakeList(),bySec={};L.forEach(x=>{bySec[x.q.t]=(bySec[x.q.t]||0)+1});
  const top=Object.entries(bySec).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let h=`<h1>Wrong questions</h1><div class="card"><div class="field"><label>Show</label>${mseg('scope',[['now','Still wrong (latest try)'],['ever','Ever got wrong']])}</div>
   <div class="field"><label>When</label>${mseg('since',[['all','Any time'],['7','Last 7 days'],['exp','Since last export']])}</div>
   <div class="row"><button class="btn pri" data-act="mreview" ${L.length?'':'disabled'}>Review answers (${L.length})</button>
   <button class="btn go" data-act="mpractise" ${L.length?'':'disabled'}>Re-attempt</button></div>
   <div class="mute small" style="margin-top:8px">Review shows each question with the right answer, your answer and the explanations. Re-attempt asks them again.</div></div>
  <div class="card"><h2>Send to Google Drive for Claude</h2>${driveCard(L)}</div>`;
  if(top.length)h+=`<div class="card"><h2>Where the mistakes are</h2>${top.map(([t,n])=>`<div class="pl"><div class="n small">${T[t].section_no} ${esc(T[t].section)}</div><div class="c">${n} question${n>1?'s':''}</div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>${L.length} question${L.length===1?'':'s'}</h2>`;
  if(!L.length)h+='<div class="empty">No mistakes to show with these filters.</div>';
  L.forEach(x=>{const q=x.q,mine=q.opts.find(o=>o.l===x.lw[1]),right=q.opts.find(o=>o.l===q.ans);
    h+=`<div class="mrow"><div class="q"><div class="mute small">${T[q.t].section_no} ${esc(T[q.t].section)} · wrong ${x.n}× of ${x.tries} · ${new Date(x.lw[0]).toLocaleDateString()}${x.last[2]?' · <span style="color:var(--okd)">right last time</span>':''}</div>
      <div>${esc((q.lead||q.stem).slice(0,180))}</div>
      <div class="ab">You: <b class="r">${x.lw[1]}. ${esc(mine?mine.x:'')}</b> · Answer: <b class="g">${q.ans}. ${esc(right?right.x:'')}</b></div></div>
      <div class="row" style="flex-direction:column;gap:6px"><button class="btn sm" data-act="rone" data-k="${x.k}">Review</button><button class="btn sm ghost" data-act="master" data-k="${x.k}" title="Hide until you get it wrong again">✓ Got it</button></div></div>`});
  app.innerHTML=h+'</div>'}
function mistakesText(L){
  const lines=[`# MRCS Part A — questions I got wrong`,`Exported ${new Date().toLocaleString()} · ${L.length} questions`,``,
   `Instructions for Claude: for each question, explain (1) why the correct answer is right, (2) why my answer is wrong, `+
   `(3) the underlying concept I am missing, in surgical-exam depth, and (4) one high-yield fact to remember. `+
   `Use mostly clinical terms; use an analogy only for a genuinely difficult concept. Cite current guidelines or textbooks where relevant.`,``];
  L.forEach((x,i)=>{const q=x.q,mine=q.opts.find(o=>o.l===x.lw[1]),right=q.opts.find(o=>o.l===q.ans);
    lines.push(`---`,``,`## ${i+1}. ${T[q.t].section_no} ${T[q.t].section} (${T[q.t].chapter})`,``,q.stem.trim(),``);
    q.opts.forEach(o=>lines.push(`- ${o.l}. ${o.x}`));
    lines.push(``,`**My answer:** ${x.lw[1]}. ${mine?mine.x:''} (wrong ${x.n} of ${x.tries} attempts)`,`**Correct answer:** ${q.ans}. ${right?right.x:''}`,``);
    if(right&&right.e)lines.push(`**Pastest explanation (correct answer):** ${right.e}`,``);
    if(mine&&mine.e&&mine!==right)lines.push(`**Pastest explanation (my answer):** ${mine.e}`,``);
    if(q.gen)lines.push(q.gen,``);
    if(P.notes[x.k])lines.push(`**My note:** ${P.notes[x.k]}`,``)});
  return lines.join('\n')}
async function mexport(){const L=mistakeList();if(!L.length)return;const txt=mistakesText(L);
  const name=`MRCS mistakes ${day(Date.now())}.md`,file=new File([txt],name,{type:'text/markdown'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});P.exp=Date.now();save(true);mistakes();return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();P.exp=Date.now();save(true);
  toast('Saved — upload it to your Google Drive');mistakes()}
async function mcopy(){const L=mistakeList().slice(0,25);const txt=mistakesText(L);
  try{await navigator.clipboard.writeText(txt);toast(`Copied ${L.length} question${L.length>1?'s':''} — paste into Claude`)}
  catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied — paste into Claude')}}
function reviewOnly(items,name){
  // read-only pass through questions you got wrong: your (wrong) answer, the right one, explanations
  S={id:'review',name,mode:'practice',timer:'off',start:Date.now(),qs:items.map(x=>x.k),i:0,
     ans:Object.fromEntries(items.map(x=>[x.k,x.lw[1]])),sub:{},times:{},st:{},hl:{},elapsed:0,limit:0,done:true,reviewOnly:true};
  go('quiz')}
// ---------------------------------------------------------------- Google Drive upload
const DRIVE_DEFAULT=/*__DRIVE__*/null;
function drive(){return (P.drive&&P.drive.url)?P.drive:(DRIVE_DEFAULT||{})}
function driveCard(L){const d=drive();
  if(!d.url)return `<p class="small" style="margin-top:0">Connect your Google Drive once, then one tap saves these questions as a Google Doc in a Drive folder called <b>MRCS Mistakes</b>. Ask Claude to go through it with you.</p>
    <div class="field"><label>Upload link</label><input type="search" id="durl" style="flex:1" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label>Password</label><input type="search" id="dtok" style="flex:1" placeholder="the password set in the Drive script"></div>
    <div class="row"><button class="btn" data-act="dsave">Connect</button><span class="sp"></span><button class="btn ghost sm" data-act="mexport" ${L.length?'':'disabled'}>Download file instead</button><button class="btn ghost sm" data-act="mcopy" ${L.length?'':'disabled'}>Copy for Claude</button></div>`;
  return `<div class="row"><button class="btn go" data-act="dup" id="dupbtn" ${L.length?'':'disabled'}>Upload ${L.length} to Google Drive</button>
    <button class="btn" data-act="mcopy" ${L.length?'':'disabled'}>Copy for Claude</button><button class="btn ghost sm" data-act="mexport" ${L.length?'':'disabled'}>Download file</button>
    <span class="sp"></span><button class="btn ghost sm" data-act="dforget">Disconnect</button></div>
    <div class="mute small" style="margin-top:8px">Saves a Google Doc in <b>MRCS Mistakes</b> with each question, your answer, the right answer, the explanations and your notes. Then ask Claude: “explain my latest MRCS mistakes from Google Drive”.${P.exp?'<br>Last sent: '+new Date(P.exp).toLocaleString()+' — use “Since last export” above to send only new ones.':''}${P.lastDoc?` <a href="${esc(P.lastDoc)}" target="_blank" rel="noopener">Open last doc</a>`:''}</div>`}
async function driveUpload(){const L=mistakeList();if(!L.length)return;const d=drive();const b=$('dupbtn');if(b){b.disabled=true;b.textContent='Uploading…'}
  const name='MRCS mistakes '+new Date().toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const body=JSON.stringify({token:d.token||'',name,content:mistakesText(L),count:L.length});
  try{const r=await fetch(d.url,{method:'POST',body});const j=await r.json();
    if(!j.ok)throw new Error(j.error||'refused');P.exp=Date.now();P.lastDoc=j.url||'';save(true);toast(`Saved to Google Drive: ${name}`);mistakes()}
  catch(e){ if(e&&/refused|password|token/i.test(e.message)){toast('Google Drive refused it — check the password');mistakes();return}
    // some browsers block reading the reply; send it blind and trust the script
    try{await fetch(d.url,{method:'POST',body,mode:'no-cors'});P.exp=Date.now();save(true);toast('Sent to Google Drive — look in the MRCS Mistakes folder')}
    catch(e2){toast('Could not reach Google Drive — check your connection')}mistakes()}}
// ---------------------------------------------------------------- flagged & notes
function flagged(){
  const keys=[...new Set([...Object.keys(P.f),...Object.keys(P.notes)])].filter(k=>QK[k]).sort();
  let h=`<h1>Flagged & notes</h1><div class="card">`;
  if(!keys.length)h+='<div class="empty">Nothing yet. Flag questions (F) or write notes under an explanation, and they will be collected here.</div>';
  else h+=`<div class="row" style="margin-bottom:12px"><button class="btn go" data-act="quick" data-k="flag" ${Object.keys(P.f).length?'':'disabled'}>Practise flagged (${Object.keys(P.f).length})</button></div><table><tr><th>Question</th><th>Note</th><th></th></tr>`+
    keys.map(k=>{const q=QK[k];return `<tr><td style="width:45%"><span class="mute small">${T[q.t].section_no} ${esc(T[q.t].section)}${P.f[k]?' · <span style="color:var(--flag)">⚑ flagged</span>':''}</span><br>${esc((q.lead||q.stem).slice(0,140))}</td><td class="small">${esc(P.notes[k]||'')}</td><td class="n"><button class="btn sm" data-act="one" data-k="${k}">Open</button></td></tr>`}).join('')+'</table>';
  app.innerHTML=h+'</div>'}
// ---------------------------------------------------------------- actions
const ACT={
  go:d=>go(d.v), resume, discard:()=>{if(!confirm('Discard the unfinished session? Answers already submitted stay in your stats.'))return;
    P.sessions=P.sessions.filter(s=>s.id!==P.cur);P.cur=null;save(true);go('dash')},
  resumeid:d=>{P.cur=d.id;resume()}, openres:d=>go('results',d.id),
  delsess:d=>{if(!confirm('Delete this session from history? Your answer statistics are kept.'))return;P.sessions=P.sessions.filter(s=>s.id!==d.id);if(P.cur===d.id)P.cur=null;save(true);history()},
  quick:d=>{const cur=P.sessions.find(s=>s.id===P.cur&&!s.done);if(cur&&!confirm('You have an unfinished session. Start a new one anyway? (It stays in History.)'))return;quick(d.k)},
  cfg:d=>{cfg[d.k]=isNaN(+d.val)?d.val:+d.val;saveCfg();build()},
  selp:d=>{const p=+d.p;cfg.sel=p<0?[]:DB.topics.filter(t=>!p||(PAPER[t.chapter_no]||1)===p).map(t=>t.id);saveCfg();build()},
  selch:(d,e)=>{const on=e.target.checked,s=new Set(cfg.sel);CH[d.c].secs.forEach(t=>on?s.add(t.id):s.delete(t.id));cfg.sel=[...s];saveCfg();build()},
  selsec:(d,e)=>{const s=new Set(cfg.sel);e.target.checked?s.add(+d.t):s.delete(+d.t);cfg.sel=[...s];saveCfg();availCount()},
  tog:d=>{const c=+d.c;openCh.has(c)?openCh.delete(c):openCh.add(c);build()},
  start:()=>{const cur=P.sessions.find(s=>s.id===P.cur&&!s.done);if(cur&&!confirm('You have an unfinished session. Start a new one anyway? (It stays in History.)'))return;startFromCfg()},
  pick:(d,e)=>{if(e.target.closest('.x'))return;pick(d.l)}, strike:(d,e)=>{e.stopPropagation();strike(d.l)},
  submit, mv:d=>mv(+d.d), jump:d=>{S.i=+d.i;save();quiz()}, flag, endask:endAsk,
  pause:()=>{S.paused=!S.paused;lastTick=Date.now();save(true);quiz()},
  clearhl:()=>{delete S.hl[S.qs[S.i]];save();quiz()},
  toresults:()=>S.reviewOnly?go('mistakes'):go('results',S.id), rev:d=>{S.i=+d.i;go('quiz')},
  retry:()=>{const keys=S.qs.filter(k=>S.ans[k]!==QK[k]?.ans);newSession(shuffle(keys),{name:'Retry: '+S.name.replace(/^Retry: /,''),mode:'practice',timer:'up'})},
  psort:d=>{perfSort=d.s;perf()}, drill:d=>{cfg.sel=[+d.t];cfg.pool='all';cfg.kw='';saveCfg();go('build')},
  export:exportP, import:()=>$('impf').click(),
  reset:()=>{if(!confirm('Erase all answers, flags, notes and history? This cannot be undone (export first if unsure).'))return;P={h:{},f:{},notes:{},sessions:[],cur:null,cfg:P.cfg};save(true);perf()},
  one:d=>newSession([d.k],{name:'Single question',mode:'practice',timer:'up'}),
  mf:d=>{mf[d.k]=d.val;mistakes()}, master:d=>{P.m[d.k]=Date.now();save(true);mistakes()},
  mpractise:()=>{const L=mistakeList();newSession(shuffle(L.map(x=>x.k)),{name:'Mistakes review',mode:'practice',timer:'up'})},
  mexport, mcopy,
  mreview:()=>{const L=mistakeList();if(L.length)reviewOnly(L,'Review: wrong questions')},
  rone:d=>{const x=mistakeList().find(y=>y.k===d.k)||{k:d.k,lw:[0,(last(d.k)||[])[1]]};reviewOnly([x],'Review: one question')},
  dsave:()=>{const url=$('durl').value.trim(),token=$('dtok').value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('That does not look like a Google Apps Script link');return}
    P.drive={url,token};save(true);toast('Google Drive connected');mistakes()},
  dforget:()=>{P.drive={url:'',token:''};save(true);mistakes()},
  dup:driveUpload,
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'&&e.type==='click'){ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset,e);return}
  const f=ACT[el.dataset.act];if(f)f(el.dataset,e)});
document.addEventListener('keydown',e=>{if(view!=='quiz'||!S||/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toUpperCase(),q=QK[S.qs[S.i]];
  if(k==='P'&&!S.done){ACT.pause();return}if(S.paused)return;
  if(q.opts.some(o=>o.l===k)){pick(k);return}
  if(k==='ENTER'){const kk=S.qs[S.i];if(!S.done&&S.mode==='practice'&&!S.sub[kk])submit();else if(S.i<S.qs.length-1)mv(1);e.preventDefault()}
  else if(k==='ARROWRIGHT')mv(1);else if(k==='ARROWLEFT')mv(-1);else if(k==='F')flag()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&view==='quiz')save(true)});
window.addEventListener('beforeunload',()=>save(true));
// migrate: sessions from older versions had no data; keep answers/flags as they are
go('dash');
</script></body></html>
